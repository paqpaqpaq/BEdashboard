<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BE — capaciteit instellen (proef)</title>
<style>body{margin:0;padding:clamp(16px,5vw,56px);background:#f7f4fa;color:#26212b;font:14px system-ui}section{max-width:850px;margin:auto;background:white;border:1px solid #ded5e7;border-radius:14px;padding:24px}h1{font-size:21px;color:#673681;margin:0 0 8px}p{line-height:1.5}.notice{color:#67596e;margin-bottom:24px}form{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px;font-size:13px}input,select,button{box-sizing:border-box;border:1px solid #aaa;border-radius:6px;padding:9px;background:white;color:inherit;font:inherit}input{width:120px}button{cursor:pointer;border-color:#0891b2}span[data-cap-fcc]{display:flex;gap:14px;flex-wrap:wrap;align-items:end}[hidden]{display:none!important}output,small{flex-basis:100%;display:block}output{color:#087f9c;font-size:18px;font-weight:650;margin-top:12px}small{font-size:12px;line-height:1.5;color:#65596b}#status{margin-top:24px;min-height:1.5em;color:#67596e}</style>
<section><h1>Capaciteit voor Coulombtelling</h1><p class="notice">Voorbeeld met 3 accu’s van gemiddeld 328 Ah. Dit is een losse voorvertoning; je dashboard wordt niet aangepast.</p><form data-settings><label>Capaciteit invoeren<select name="capacityMode"><option value="kwh">kWh handmatig</option><option value="fcc">FCC per accu (Ah)</option></select></label><label data-cap-kwh>Totale capaciteit (kWh)<input name="capacity" type="number" min="0.01" max="1000" step="0.01" required></label><span data-cap-fcc hidden><label>Gemiddelde FCC (Ah)<input name="fccAh" type="number" min="0.01" max="100000" step="0.01"></label><label>Aantal accu’s<input name="packCount" type="number" min="1" max="100" step="1"></label><label>Nominale spanning per accu (V)<input name="nominalVoltage" type="number" min="1" max="1000" step="0.1"></label></span><button>Capaciteit opslaan</button><output data-capacity-preview></output><small data-capacity-help></small></form><p id="status">Kies een methode en probeer de invoer.</p></section><script>
(function(root){
  'use strict';
  const numeric=v=>typeof v==='number'?v:typeof v==='string'&&/^\d+(?:[.,]\d+)?$/.test(v.trim())?Number(v.trim().replace(',','.')):NaN;
  function resolve(value){
    const c=value&&typeof value==='object'?value:{};
    if(c.capacityMode==='fcc'){
      const fccAh=numeric(c.fccAh),packCount=numeric(c.packCount),nominalVoltage=numeric(c.nominalVoltage);
      if(!(fccAh>0&&Number.isInteger(packCount)&&packCount>=1&&packCount<=100&&nominalVoltage>=1&&nominalVoltage<=1000))return null;
      const capacity=fccAh*packCount*nominalVoltage/1000;
      return capacity>=.01&&capacity<=1000?{mode:'fcc',capacity,fccAh,packCount,nominalVoltage}:null;
    }
    if(c.capacityMode&&c.capacityMode!=='kwh')return null;
    const capacity=numeric(c.capacityKwh??c.capacity);
    return capacity>=.01&&capacity<=1000?{mode:'kwh',capacity}:null;
  }
  function readForm(form,previous={}){
    const next={...previous,capacityMode:form.elements.capacityMode.value,
      capacityKwh:numeric(form.elements.capacity.value),fccAh:numeric(form.elements.fccAh.value),
      packCount:numeric(form.elements.packCount.value),nominalVoltage:numeric(form.elements.nominalVoltage.value)};
    const resolved=resolve(next);return resolved?{...next,capacity:resolved.capacity}:null;
  }
  root.BECapacity={numeric,resolve,readForm};
})(typeof window!=='undefined'?window:globalThis);

(function(){let cfg={capacityMode:'fcc',fccAh:328,packCount:3,nominalVoltage:51.2,capacityKwh:50.3},error='';const key='be-capacity-preview-only';const localStorage={setItem(){}};const p=document.querySelector('section');
const number=(v,n=2)=>v.toLocaleString('nl-NL',{minimumFractionDigits:n,maximumFractionDigits:n});
function textIfChanged(el,value){if(el.textContent!==value)el.textContent=value;}
function compute(){}function render(){document.getElementById('status').textContent=error||'Voorbeeld opgeslagen: '+number(window.BECapacity.resolve(cfg).capacity)+' kWh. Je dashboard is niet aangepast.';}
    const f=p.querySelector('[data-settings]'),resolved=window.BECapacity.resolve(cfg);
    f.elements.capacityMode.value=cfg.capacityMode==='fcc'?'fcc':'kwh';
    f.elements.capacity.value=cfg.capacityKwh??(resolved?.mode==='kwh'?resolved.capacity:'');
    f.elements.fccAh.value=cfg.fccAh??'';
    f.elements.packCount.value=cfg.packCount??'';
    f.elements.nominalVoltage.value=cfg.nominalVoltage??51.2;
    function preview(){
      const fcc=f.elements.capacityMode.value==='fcc';
      f.querySelector('[data-cap-kwh]').hidden=fcc;f.querySelector('[data-cap-fcc]').hidden=!fcc;
      f.elements.capacity.disabled=fcc;f.elements.capacity.required=!fcc;
      for(const name of ['fccAh','packCount','nominalVoltage']){f.elements[name].disabled=!fcc;f.elements[name].required=fcc;}
      const next=window.BECapacity.readForm(f,cfg),cap=next&&window.BECapacity.resolve(next);
      textIfChanged(f.querySelector('[data-capacity-preview]'),cap?'Rekencapaciteit: '+number(cap.capacity,2)+' kWh':'Vul de capaciteit in');
      textIfChanged(f.querySelector('[data-capacity-help]'),fcc?'Gemiddelde FCC × aantal accu’s × nominale spanning ÷ 1000. Gebruik de FCC in Ah uit je BMS.':'Je eigen rekencapaciteit voor het hele systeem. Account wordt niet automatisch overgenomen.');
    }
    f.oninput=preview;f.onchange=preview;preview();
    f.onsubmit=async e=>{
      e.preventDefault();if(!f.reportValidity())return;
      const next=window.BECapacity.readForm(f,cfg);
      if(!next){error='Vul een geldige rekencapaciteit in';render();return;}
      try{localStorage.setItem(key,JSON.stringify(next));cfg=next;error='';compute();render();}catch(e){error='Opslaan mislukt: '+e.message;render();}
    };
})();</script></html>
